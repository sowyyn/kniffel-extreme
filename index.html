function Stats({games,roster,tab,setTab,filter,setFilter,selPlayer,setSelPlayer,cmp,setCmp,onArchive,onHardDelete,onRestore,onBack}) {
  const [deleteConfirm, setDeleteConfirm] = useState(null); // name to delete
  const archive = ls('kx:archive', []);
  const filteredGames = filter==='all' ? games : games.filter(g=>gameMode(g)===filter);

  if (!games.length) return html`<div style=${{maxWidth:460,margin:'0 auto',padding:'60px 20px',textAlign:'center'}}>
    <button onClick=${onBack} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:16,display:'block',marginBottom:32}}>‹ Zurück</button>
    <div style=${{fontSize:40,marginBottom:12}}>📊</div>
    <div style=${{color:C.muted}}>Noch keine Spiele gespeichert.</div>
  </div>`;

  const manualCount = games.filter(g=>gameMode(g)==='manual').length;
  const appCount    = games.filter(g=>gameMode(g)==='app').length;

  // All players who ever played — derived from game history, not roster.
  // This ensures deleted players still appear in stats.
  const allHistoryPlayers = [...new Set(games.flatMap(g=>g.players.map(p=>p.name)))];
  // Stable color: use roster index if present, else position in history list
  const colorIdx = name => {
    const ri = roster.indexOf(name);
    return ri >= 0 ? ri : roster.length + allHistoryPlayers.indexOf(name);
  };

  const playerStats=allHistoryPlayers.map(name=>{
    const pg=filteredGames.filter(g=>g.players.some(p=>p.name===name));
    if (!pg.length) return null;
    const getP=g=>g.players.find(p=>p.name===name);
    const sc=pg.map(g=>calc(getP(g).scores));
    const tots=sc.map(s=>s.total);
    const wins=pg.filter(g=>{const all=g.players.map(p=>calc(p.scores).total),my=calc(getP(g).scores).total;return my===Math.max(...all)&&all.filter(s=>s===my).length===1;}).length;
    const catData=[...UPPER,...LOWER].map(cat=>{
      const entries=pg.map(g=>getP(g).scores[cat.id]).filter(v=>v!==undefined);
      const ach=entries.filter(v=>v>0);
      return {id:cat.id,label:cat.label,played:entries.length,achN:ach.length,rate:entries.length?Math.round(ach.length/entries.length*100):0,avgPts:ach.length?Math.round(ach.reduce((a,b)=>a+b,0)/ach.length):0};
    });
    const avgDice=UPPER.map(cat=>{
      const vals=pg.filter(g=>getP(g).scores[cat.id]>0).map(g=>Math.round(getP(g).scores[cat.id]/cat.n));
      return {label:cat.face,name:cat.label,val:vals.length?+(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):0};
    });
    const ci = colorIdx(name);
    return {name,n:pg.length,wins,avg:avg(tots),best:tots.length?Math.max(...tots):0,worst:tots.length?Math.min(...tots):0,bonusRate:pg.length?Math.round(sc.filter(s=>s.b>0).length/pg.length*100):0,catData,avgDice,tots,ci};
  }).filter(Boolean);

  const TABS=[{id:'leaderboard',l:'Rangliste'},{id:'player',l:'Spieler'},{id:'compare',l:'Vergleich'},{id:'dice',l:'Würfel'},{id:'gesamt',l:'Gesamt'},{id:'archiv',l:'Archiv'+(archive.length?' ('+archive.length+')':'')}];
  const selP=selPlayer||playerStats[0]?.name;
  const selSt=playerStats.find(p=>p.name===selP);

  const Sel=({val,set,label})=>html`<div style=${{marginBottom:14}}>
    ${label&&html`<div style=${{fontSize:11,color:C.muted2,letterSpacing:1,textTransform:'uppercase',marginBottom:5,fontWeight:700}}>${label}</div>`}
    <div style=${{position:'relative'}}>
      <select value=${val||''} onChange=${e=>set(e.target.value)} style=${{width:'100%',background:C.surface2,border:`1px solid ${C.border}`,borderRadius:12,padding:'10px 36px 10px 14px',color:C.text,fontSize:14,outline:'none',cursor:'pointer'}}>
        <option value="">Spieler wählen…</option>
        ${playerStats.map(p=>html`<option key=${p.name} value=${p.name}>${p.name}</option>`)}
      </select>
      <span style=${{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',color:C.muted,pointerEvents:'none'}}>▾</span>
    </div>
  </div>`;

  return html`<div style=${{maxWidth:460,margin:'0 auto'}}>
    <div style=${{position:'sticky',top:0,background:C.bg,zIndex:10,padding:'12px 16px',borderBottom:`1px solid ${C.border}`}}>
      <div style=${{display:'flex',alignItems:'center',gap:12}}>
        <button onClick=${onBack} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:20,padding:0}}>‹</button>
        <span style=${{fontWeight:800,fontSize:18,flex:1}}>Statistiken</span>
        <span style=${{fontSize:12,color:C.muted2}}>${filteredGames.length}/${games.length} Spiele</span>
      </div>

      <!-- Mode filter -->
      <div style=${{display:'flex',gap:6,marginTop:10,marginBottom:2}}>
        ${[['all','Alle',games.length],['manual','📝',manualCount],['app','🎲',appCount]].map(([id,lbl,cnt])=>html`
          <button key=${id} onClick=${()=>setFilter(id)} style=${{
            padding:'5px 10px',borderRadius:20,border:`1px solid ${filter===id?PC[0]:C.border}`,
            background:filter===id?'rgba(168,85,247,0.15)':C.surface2,
            color:filter===id?PCL[0]:C.muted,cursor:'pointer',fontSize:12,fontWeight:filter===id?700:400,
          }}>${lbl} <span style=${{opacity:0.7}}>(${cnt})</span></button>
        `)}
      </div>

      <div style=${{display:'flex',marginTop:6,borderBottom:`1px solid ${C.border}`,overflowX:'auto'}}>
        ${TABS.map(t=>html`<button key=${t.id} onClick=${()=>setTab(t.id)} style=${{flexShrink:0,background:'none',border:'none',cursor:'pointer',padding:'8px 12px',fontSize:12,fontWeight:600,color:tab===t.id?PCL[0]:C.muted,borderBottom:tab===t.id?`2px solid ${PC[0]}`:'2px solid transparent'}}>${t.l}</button>`)}
      </div>
    </div>

    <div style=${{padding:16}}>
      ${!playerStats.length && html`<div style=${{textAlign:'center',color:C.muted,padding:40}}>Keine Daten für diesen Filter.</div>`}

      ${tab==='leaderboard'&&playerStats.length>0&&html`<div>
        ${[...playerStats].sort((a,b)=>b.avg-a.avg).map((p,rank)=>{
          const ci=p.ci;
          return html`<div key=${p.name} style=${{background:C.surface,borderRadius:16,padding:'12px 16px',marginBottom:8,display:'grid',gridTemplateColumns:'28px 1fr auto',gap:12,alignItems:'center',borderLeft:`3px solid ${PC[ci%5]}`}}>
            <div style=${{fontSize:18,fontWeight:900,color:rank===0?'#fde68a':C.muted2}}>${rank+1}.</div>
            <div>
              <div style=${{fontWeight:700,fontSize:15,color:PCL[ci%5]}}>${p.name}</div>
              <div style=${{fontSize:11,color:C.muted,marginTop:2}}>${p.n} Spiele · ${p.wins} Siege · Bonus ${p.bonusRate}%</div>
            </div>
            <div style=${{textAlign:'right',display:'flex',alignItems:'center',gap:10}}>
              <div>
                <div style=${{fontSize:22,fontWeight:900}}>${p.avg}</div>
                <div style=${{fontSize:10,color:C.muted}}>Ø Punkte</div>
              </div>
              <button onClick=${()=>setDeleteConfirm(p.name)} style=${{
                background:'none',border:`1px solid ${C.border}`,borderRadius:8,
                padding:'6px 8px',color:C.muted,cursor:'pointer',fontSize:14,lineHeight:1,
              }} title="Aus Statistik löschen">🗑</button>
            </div>
          </div>`;
        })}
        ${filteredGames.length>1&&html`<div style=${{background:C.surface,borderRadius:16,padding:14,marginTop:16}}>
          <div style=${{fontSize:13,fontWeight:700,marginBottom:8}}>Punktverlauf</div>
          <div style=${{height:160}}>
            <${ResponsiveContainer} width="100%" height="100%">
              <${BarChart} data=${filteredGames.map((g,i)=>({i:i+1,...Object.fromEntries(g.players.map(p=>[p.name,calc(p.scores).total]))}))}>
                <${XAxis} dataKey="i" tick=${{fill:C.muted,fontSize:10}} axisLine=${false} tickLine=${false}/>
                <${YAxis} hide=${true}/>
                <${Tooltip} contentStyle=${{background:C.surface2,border:`1px solid ${C.border}`,borderRadius:10}} cursor=${{fill:'rgba(255,255,255,0.05)'}}/>
                ${playerStats.map((p)=>html`<${Bar} key=${p.name} dataKey=${p.name} fill=${PC[p.ci%5]} radius=${[3,3,0,0]}/>`)}
              </${BarChart}>
            </${ResponsiveContainer}>
          </div>
        </div>`}
      </div>`}

      ${tab==='player'&&html`<div>
        <${Sel} val=${selP} set=${setSelPlayer} label="Spieler"/>
        ${selSt&&(()=>{const ci=selSt.ci;return html`<div>
          <div style=${{background:C.surface,borderRadius:16,padding:14,marginBottom:12,borderTop:`3px solid ${PC[ci%5]}`}}>
            <div style=${{fontSize:15,fontWeight:800,color:PCL[ci%5],marginBottom:10}}>${selSt.name}</div>
            <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
              ${[['Spiele',selSt.n],['Siege',selSt.wins],['Ø Punkte',selSt.avg||'—'],['Bestwert',selSt.best||'—'],['Schlechtester',selSt.worst||'—'],['Bonus-Rate',selSt.bonusRate+'%']].map(([l,v])=>html`<div style=${{background:C.surface2,borderRadius:10,padding:'8px 10px',textAlign:'center'}}>
                <div style=${{fontSize:10,color:C.muted,marginBottom:3}}>${l}</div>
                <div style=${{fontSize:14,fontWeight:700}}>${v}</div>
              </div>`)}
            </div>
          </div>
          <div style=${{background:C.surface,borderRadius:16,padding:14}}>
            <div style=${{fontSize:13,fontWeight:700,marginBottom:10}}>Kategorie-Erreichungsrate</div>
            ${selSt.catData.filter(c=>c.played>0&&LOWER.some(l=>l.id===c.id)).map(c=>html`<div key=${c.id} style=${{marginBottom:8}}>
              <div style=${{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                <span style=${{fontSize:12}}>${c.label}</span>
                <span style=${{fontSize:12}}><strong>${c.rate}%</strong>${c.avgPts>0?html`<span style=${{color:C.muted}}> · Ø ${c.avgPts}</span>`:''}<span style=${{color:C.muted2}}> (${c.achN}/${c.played})</span></span>
              </div>
              <div style=${{height:5,background:C.surface2,borderRadius:3,overflow:'hidden'}}><div style=${{height:5,borderRadius:3,background:PC[ci%5],width:`${c.rate}%`}}/></div>
            </div>`)}
          </div>
          <button onClick=${()=>setDeleteConfirm(selSt.name)} style=${{
            width:'100%',marginTop:12,padding:'11px',borderRadius:14,
            background:'transparent',border:`1px solid ${C.border}`,
            color:C.muted,cursor:'pointer',fontSize:13,fontWeight:600,
          }}>🗑 ${selSt.name} aus Statistik löschen</button>
        </div>`;})()} 
      </div>`}

      ${tab==='compare'&&html`<div>
        <${Sel} val=${cmp[0]} set=${v=>setCmp([v,cmp[1]])} label="Spieler 1"/>
        <${Sel} val=${cmp[1]} set=${v=>setCmp([cmp[0],v])} label="Spieler 2"/>
        ${cmp[0]&&cmp[1]&&cmp[0]!==cmp[1]&&(()=>{
          const p1=cmp[0],p2=cmp[1];
          const shared=filteredGames.filter(g=>g.players.some(p=>p.name===p1)&&g.players.some(p=>p.name===p2));
          if(!shared.length) return html`<div style=${{color:C.muted,textAlign:'center',padding:20}}>Keine gemeinsamen Spiele.</div>`;
          const getS=(g,n)=>calc(g.players.find(p=>p.name===n).scores).total;
          const p1w=shared.filter(g=>getS(g,p1)>getS(g,p2)).length,p2w=shared.filter(g=>getS(g,p2)>getS(g,p1)).length,ties=shared.length-p1w-p2w;
          const ci1=playerStats.find(p=>p.name===p1)?.ci??0,ci2=playerStats.find(p=>p.name===p2)?.ci??1;const c1=PC[ci1%5],c2=PC[ci2%5],cl1=PCL[ci1%5],cl2=PCL[ci2%5];
          const p1t=shared.map(g=>getS(g,p1)),p2t=shared.map(g=>getS(g,p2));
          return html`<div>
            <div style=${{background:C.surface,borderRadius:16,padding:16,marginBottom:12}}>
              <div style=${{fontSize:13,fontWeight:700,marginBottom:12,color:C.muted}}>${shared.length} gemeinsame Spiele</div>
              <div style=${{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:12,alignItems:'center',textAlign:'center'}}>
                <div><div style=${{fontSize:13,color:cl1,fontWeight:700,marginBottom:6}}>${p1}</div><div style=${{fontSize:36,fontWeight:900,color:p1w>p2w?cl1:C.muted}}>${p1w}</div><div style=${{fontSize:10,color:C.muted}}>Siege</div></div>
                <div style=${{color:C.muted2,fontSize:20}}>vs</div>
                <div><div style=${{fontSize:13,color:cl2,fontWeight:700,marginBottom:6}}>${p2}</div><div style=${{fontSize:36,fontWeight:900,color:p2w>p1w?cl2:C.muted}}>${p2w}</div><div style=${{fontSize:10,color:C.muted}}>Siege</div></div>
              </div>
              ${ties>0&&html`<div style=${{textAlign:'center',marginTop:8,fontSize:12,color:C.muted2}}>${ties} Unentschieden</div>`}
            </div>
            <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
              ${[[p1,p1t,cl1],[p2,p2t,cl2]].map(([name,tots,cl])=>html`<div key=${name} style=${{background:C.surface,borderRadius:14,padding:12}}>
                <div style=${{fontSize:11,color:cl,fontWeight:700,marginBottom:6}}>${name}</div>
                ${[['Ø Punkte',avg(tots)],['Bestwert',Math.max(...tots)],['Schlechtester',Math.min(...tots)]].map(([l,v])=>html`<div style=${{display:'flex',justifyContent:'space-between',padding:'3px 0',borderBottom:`1px solid ${C.border}`}}><span style=${{fontSize:10,color:C.muted}}>${l}</span><span style=${{fontSize:12,fontWeight:700}}>${v}</span></div>`)}
              </div>`)}
            </div>
            ${shared.length>1&&html`<div style=${{background:C.surface,borderRadius:16,padding:14}}>
              <div style=${{fontSize:13,fontWeight:700,marginBottom:8}}>Punktverlauf</div>
              <div style=${{height:150}}>
                <${ResponsiveContainer} width="100%" height="100%">
                  <${BarChart} data=${shared.map((g,i)=>({i:i+1,[p1]:getS(g,p1),[p2]:getS(g,p2)}))} barCategoryGap="20%">
                    <${XAxis} dataKey="i" tick=${{fill:C.muted,fontSize:10}} axisLine=${false} tickLine=${false}/>
                    <${YAxis} hide=${true}/>
                    <${Tooltip} contentStyle=${{background:C.surface2,border:`1px solid ${C.border}`,borderRadius:10}} cursor=${{fill:'rgba(255,255,255,0.05)'}}/>
                    <${Bar} dataKey=${p1} fill=${c1} radius=${[4,4,0,0]}/><${Bar} dataKey=${p2} fill=${c2} radius=${[4,4,0,0]}/>
                  </${BarChart}>
                </${ResponsiveContainer}>
              </div>
            </div>`}
          </div>`;
        })()}
      </div>`}

      ${tab==='dice'&&html`<div>
        <${Sel} val=${selP} set=${setSelPlayer} label="Spieler"/>
        ${selSt&&html`<div style=${{background:C.surface,borderRadius:16,padding:14}}>
          <div style=${{fontSize:13,fontWeight:700,marginBottom:4}}>Ø Würfelanzahl pro Seite</div>
          <div style=${{fontSize:11,color:C.muted,marginBottom:12}}>Nur gewertete (nicht gestrichene) Felder.</div>
          <div style=${{height:180}}>
            <${ResponsiveContainer} width="100%" height="100%">
              <${BarChart} data=${selSt.avgDice} barCategoryGap="15%">
                <${XAxis} dataKey="label" tick=${{fill:C.muted,fontSize:18}} axisLine=${false} tickLine=${false}/>
                <${YAxis} tick=${{fill:C.muted,fontSize:10}} axisLine=${false} tickLine=${false} width=${24}/>
                <${Tooltip} contentStyle=${{background:C.surface2,border:`1px solid ${C.border}`,borderRadius:10}} cursor=${{fill:'rgba(255,255,255,0.05)'}} formatter=${(v,n)=>[`Ø ${v}`,n]}/>
                <${Bar} dataKey="val" name=${selSt.name} radius=${[5,5,0,0]}>
                  ${selSt.avgDice.map((_,i)=>html`<${Cell} key=${i} fill=${PC[selSt.ci%5]}/>`)}
                </${Bar}>
              </${BarChart}>
            </${ResponsiveContainer}>
          </div>
        </div>`}
      </div>`}

      ${tab==='gesamt'&&(()=>{
        const allCat=LOWER.map(cat=>{
          const entries=filteredGames.flatMap(g=>g.players.map(p=>p.scores[cat.id]).filter(v=>v!==undefined));
          const ach=entries.filter(v=>v>0);
          return {id:cat.id,label:cat.label,t:cat.t,pts:cat.pts,played:entries.length,achN:ach.length,rate:entries.length?Math.round(ach.length/entries.length*100):0,avg:ach.length?Math.round(ach.reduce((a,b)=>a+b,0)/ach.length):0};
        }).filter(c=>c.played>0);
        const totalPlayers=[...new Set(filteredGames.flatMap(g=>g.players.map(p=>p.name)))].length;
        const overallRate=allCat.length?Math.round(allCat.reduce((s,c)=>s+c.rate,0)/allCat.length):0;
        return html`<div>
          <div style=${{background:C.surface,borderRadius:16,padding:14,marginBottom:14,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,textAlign:'center'}}>
            ${[['Spiele',filteredGames.length],['Spieler',totalPlayers],['Ø Erreichung',overallRate+'%']].map(([l,v])=>html`<div style=${{background:C.surface2,borderRadius:12,padding:'10px 6px'}}><div style=${{fontSize:10,color:C.muted,marginBottom:4}}>${l}</div><div style=${{fontSize:18,fontWeight:900,color:PCL[0]}}>${v}</div></div>`)}
          </div>
          ${allCat.map(c=>html`<div key=${c.id} style=${{background:C.surface,borderRadius:14,padding:'11px 14px',marginBottom:8}}>
            <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
              <span style=${{fontSize:13,fontWeight:700}}>${c.label}</span>
              <span style=${{fontSize:11}}><strong style=${{color:c.rate>=70?C.green:c.rate>=40?PCL[3]:PCL[1]}}>${c.rate}%</strong>${c.t!=='fix'&&c.avg>0?html`<span style=${{color:C.muted}}> · Ø ${c.avg} Pkt</span>`:''}<span style=${{color:C.muted2}}> (${c.achN}/${c.played})</span></span>
            </div>
            <div style=${{height:6,background:C.surface2,borderRadius:3,overflow:'hidden'}}><div style=${{height:6,borderRadius:3,width:`${c.rate}%`,background:c.rate>=70?C.green:c.rate>=40?PC[3]:PC[1]}}/></div>
          </div>`)}
          <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:16}}>
            <div style=${{background:C.surface,borderRadius:14,padding:12}}><div style=${{fontSize:12,fontWeight:700,color:C.green,marginBottom:8}}>🏆 Top</div>${[...allCat].sort((a,b)=>b.rate-a.rate).slice(0,3).map(c=>html`<div key=${c.id} style=${{display:'flex',justifyContent:'space-between',padding:'4px 0',borderBottom:`1px solid ${C.border}`}}><span style=${{fontSize:11,color:C.muted}}>${c.label}</span><span style=${{fontSize:11,fontWeight:700,color:C.green}}>${c.rate}%</span></div>`)}</div>
            <div style=${{background:C.surface,borderRadius:14,padding:12}}><div style=${{fontSize:12,fontWeight:700,color:PC[1],marginBottom:8}}>📉 Schwer</div>${[...allCat].sort((a,b)=>a.rate-b.rate).slice(0,3).map(c=>html`<div key=${c.id} style=${{display:'flex',justifyContent:'space-between',padding:'4px 0',borderBottom:`1px solid ${C.border}`}}><span style=${{fontSize:11,color:C.muted}}>${c.label}</span><span style=${{fontSize:11,fontWeight:700,color:PC[1]}}>${c.rate}%</span></div>`)}</div>
          </div>
        </div>`;
      })()}

      <!-- Archiv tab -->
      ${tab==='archiv'&&html`<div>
        ${archive.length===0
          ? html`<div style=${{textAlign:'center',color:C.muted,padding:40}}>
              <div style=${{fontSize:32,marginBottom:12}}>📦</div>
              Keine archivierten Spielerinnen.
            </div>`
          : archive.map(a=>{
              const gameCount = a.gameEntries?.length ?? 0;
              return html`<div key=${a.name} style=${{
                background:C.surface,borderRadius:16,padding:'14px 16px',marginBottom:10,
                display:'flex',alignItems:'center',gap:12,
              }}>
                <div style=${{flex:1}}>
                  <div style=${{fontWeight:700,fontSize:15}}>${a.name}</div>
                  <div style=${{fontSize:11,color:C.muted,marginTop:3}}>
                    Archiviert ${a.archivedAt} · ${gameCount} Spiel${gameCount!==1?'e':''} gespeichert
                  </div>
                </div>
                <button onClick=${()=>onRestore(a.name)} style=${{
                  background:'rgba(34,197,94,0.15)',border:`1px solid ${C.green}`,
                  borderRadius:10,padding:'8px 14px',color:C.green,
                  cursor:'pointer',fontSize:12,fontWeight:700,whiteSpace:'nowrap',
                }}>↩ Wiederherstellen</button>
              </div>`;
            })}
      </div>`}
    </div>

    <!-- Delete/Archive confirmation modal -->
    ${deleteConfirm && (()=>{
      const affected = games.filter(g=>g.players.some(p=>p.name===deleteConfirm)).length;
      const hasGames = affected > 0;
      return html`<div onClick=${()=>setDeleteConfirm(null)} style=${{
        position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',
        display:'flex',alignItems:'flex-end',justifyContent:'center',zIndex:50,
      }}>
        <div onClick=${e=>e.stopPropagation()} className="slide-up" style=${{
          background:C.surface,borderRadius:'22px 22px 0 0',
          width:'100%',maxWidth:460,padding:'24px 20px 44px',
          borderTop:`2px solid ${hasGames?'#f59e0b':C.red}`,
        }}>
          <div style=${{width:36,height:4,background:C.border,borderRadius:2,margin:'0 auto 20px'}}/>
          <div style=${{fontSize:22,fontWeight:800,marginBottom:6}}>${deleteConfirm}</div>

          ${hasGames ? html`<div>
            <!-- Option 1: Archive -->
            <div style=${{background:'rgba(245,158,11,0.08)',border:'1px solid rgba(245,158,11,0.3)',
              borderRadius:14,padding:'14px',marginBottom:10}}>
              <div style=${{fontSize:13,fontWeight:700,color:'#fde68a',marginBottom:6}}>
                📦 Archivieren (empfohlen)
              </div>
              <div style=${{fontSize:12,color:C.muted,lineHeight:1.5,marginBottom:12}}>
                Spielerin wird aus der Auswahl entfernt. Ihre ${affected} Spiel${affected!==1?'e':''} bleiben
                für die anderen erhalten. Eigene Daten werden lokal gesichert
                und können jederzeit wiederhergestellt werden.
              </div>
              <button onClick=${()=>{ onArchive(deleteConfirm); setDeleteConfirm(null); }} style=${{
                width:'100%',padding:'12px',borderRadius:12,border:'none',
                background:'#92400e',color:'#fde68a',fontSize:14,fontWeight:700,cursor:'pointer',
              }}>📦 Archivieren</button>
            </div>

            <!-- Option 2: Hard delete -->
            <div style=${{marginTop:6}}>
              <button onClick=${()=>{ onHardDelete(deleteConfirm); setDeleteConfirm(null); }}
                style=${{width:'100%',padding:'10px',borderRadius:12,
                  background:'none',border:`1px solid ${C.border}`,
                  color:C.muted,fontSize:12,cursor:'pointer'}}>
                ✕ Komplett löschen inkl. aller Spiele
              </button>
            </div>
          </div>` : html`<div>
            <div style=${{fontSize:13,color:C.muted,lineHeight:1.5,marginBottom:16}}>
              Diese Spielerin hat keine Spiele und wird dauerhaft gelöscht.
            </div>
            <button onClick=${()=>{ onHardDelete(deleteConfirm); setDeleteConfirm(null); }} style=${{
              width:'100%',padding:'13px',borderRadius:14,border:'none',
              background:'#7f1d1d',color:'white',fontSize:15,fontWeight:700,cursor:'pointer',
            }}>✕ Endgültig löschen</button>
          </div>`}

          <button onClick=${()=>setDeleteConfirm(null)} style=${{
            width:'100%',marginTop:10,padding:'12px',borderRadius:14,
            background:'none',border:`1px solid ${C.border}`,
            color:C.muted,fontSize:14,cursor:'pointer',
          }}>Abbrechen</button>
        </div>
      </div>`;
    })()}
  </div>`;
}

// ══ GITHUB SETTINGS ══════════════════════════════════════════════

function GhSettings({initial,onSave,onBack}) {
  const [token,setToken]=useState(initial?.token||'');
  const [owner,setOwner]=useState(initial?.owner||'');
  const [repo,setRepo]  =useState(initial?.repo||'');
  const [testing,setTesting]=useState(false);
  const [res,setRes]=useState(null);
  const test=async()=>{setTesting(true);setRes(null);try{const r=await fetch(`https://api.github.com/repos/${owner}/${repo}`,{headers:{Authorization:`token ${token}`}});setRes(r.ok?{ok:true,msg:'✓ Verbindung erfolgreich!'}:{ok:false,msg:`Fehler ${r.status}`});}catch{setRes({ok:false,msg:'Netzwerkfehler.'});}setTesting(false);};
  const F=({label,val,set,type='text',ph})=>html`<div style=${{marginBottom:12}}><label style=${{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,textTransform:'uppercase',display:'block',marginBottom:5}}>${label}</label><input type=${type} value=${val} onChange=${e=>set(e.target.value)} placeholder=${ph} style=${{width:'100%',background:C.surface2,border:`1px solid ${C.border}`,borderRadius:12,padding:'11px 14px',color:C.text,fontSize:15,outline:'none'}}/></div>`;
  return html`<div style=${{maxWidth:400,margin:'0 auto',padding:'20px'}}>
    <div style=${{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
      <button onClick=${onBack} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:20}}>‹</button>
      <span style=${{fontSize:20,fontWeight:800}}>☁ GitHub Sync</span>
    </div>
    <div style=${{background:C.surface,borderRadius:14,padding:14,marginBottom:16,fontSize:12,color:C.muted,lineHeight:1.7}}>
      Daten beider Modi (📝 + 🎲) werden gemeinsam in <code style=${{color:PCL[0]}}>gamedata.json</code> gespeichert.
    </div>
    <${F} label="Personal Access Token" val=${token} set=${setToken} type="password" ph="ghp_..."/>
    <${F} label="GitHub-Nutzername"     val=${owner} set=${setOwner} ph="dein-name"/>
    <${F} label="Repository-Name"       val=${repo}  set=${setRepo}  ph="yahtzee-data"/>
    <div style=${{display:'flex',gap:10,marginTop:8}}>
      <button onClick=${test} disabled=${testing||!token||!owner||!repo} style=${{flex:1,background:C.surface2,border:`1px solid ${C.border}`,borderRadius:12,padding:'11px',color:C.text,cursor:'pointer',fontSize:14,fontWeight:600,opacity:(!token||!owner||!repo)?0.4:1}}>${testing?'…':'Testen'}</button>
      <button onClick=${()=>onSave({token,owner,repo})} disabled=${!token||!owner||!repo} style=${{flex:2,background:PC[0],border:'none',borderRadius:12,padding:'11px',color:'white',cursor:'pointer',fontSize:14,fontWeight:700,opacity:(!token||!owner||!repo)?0.4:1}}>Aktivieren</button>
    </div>
    ${res&&html`<div style=${{marginTop:12,padding:'10px 14px',borderRadius:10,background:res.ok?'#052e16':'#2d0a0a',color:res.ok?C.green:C.red,fontSize:13}}>${res.msg}</div>`}
    ${initial?.token&&html`<button onClick=${()=>onSave(null)} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:12,marginTop:14,display:'block',width:'100%',textAlign:'center'}}>Sync deaktivieren</button>`}
  </div>`;
}

// ══ SHARED ═══════════════════════════════════════════════════════

function Btn({onClick,bg,border,children,disabled}) {
  return html`<button onClick=${onClick} disabled=${disabled} style=${{width:'100%',padding:'13px 16px',borderRadius:14,border:border?`1px solid ${border}`:'none',background:disabled?C.muted2:bg,color:'white',fontSize:15,fontWeight:700,cursor:disabled?'not-allowed':'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,opacity:disabled?0.5:1}}>${children}</button>`;
}

// ══ BOOT ═════════════════════════════════════════════════════════

if ('serviceWorker' in navigator) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
