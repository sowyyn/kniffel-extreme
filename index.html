<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kniffel Extreme</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KniffelX">
  <meta name="theme-color" content="#7c3aed">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #0d0b1a; color: #f0eeff;
           font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
           -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    input[type=number] { -moz-appearance: textfield; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
    select { -webkit-appearance: none; appearance: none; }
    @keyframes diceRoll {
      0%   { transform: rotate(0deg)   scale(1)    translateY(0); }
      20%  { transform: rotate(-18deg) scale(0.82) translateY(-8px); }
      45%  { transform: rotate(12deg)  scale(1.12) translateY(-4px); }
      65%  { transform: rotate(-8deg)  scale(0.93) translateY(-6px); }
      82%  { transform: rotate(5deg)   scale(1.04) translateY(-2px); }
      100% { transform: rotate(0deg)   scale(1)    translateY(0); }
    }
    .die-roll  { animation: diceRoll 0.42s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes popIn {
      0%  { transform: scale(0.7); opacity:0; }
      60% { transform: scale(1.08); opacity:1; }
      100%{ transform: scale(1); }
    }
    .pop-in { animation: popIn 0.22s ease-out both; }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .slide-up { animation: slideUp 0.28s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    .glow-btn {
      background: linear-gradient(135deg,#7c3aed,#db2777,#7c3aed);
      background-size: 200% auto;
      animation: shimmer 2.5s linear infinite;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createElement as h, useState, useEffect, useRef, useCallback } from 'https://esm.sh/react@18';
import { createRoot } from 'https://esm.sh/react-dom@18/client';
import htm from 'https://esm.sh/htm@3';
import { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell } from 'https://esm.sh/recharts@2?deps=react@18,react-dom@18';
const html = htm.bind(h);

// ══ CONSTANTS ════════════════════════════════════════════════════

const UPPER = [
  { id:'einer',   label:'Einer',   face:'⚀', n:1 },
  { id:'zweier',  label:'Zweier',  face:'⚁', n:2 },
  { id:'dreier',  label:'Dreier',  face:'⚂', n:3 },
  { id:'vierer',  label:'Vierer',  face:'⚃', n:4 },
  { id:'fuenfer', label:'Fünfer',  face:'⚄', n:5 },
  { id:'sechser', label:'Sechser', face:'⚅', n:6 },
];
const LOWER = [
  { id:'dreierpasch',      label:'Dreierpasch',     t:'var', desc:'alle Augen' },
  { id:'viererpasch',      label:'Viererpasch',     t:'var', desc:'alle Augen' },
  { id:'zweiPaare',        label:'Zwei Paare',      t:'var', desc:'alle Augen' },
  { id:'dreiPaare',        label:'Drei Paare',      t:'fix', pts:35 },
  { id:'zweiDreier',       label:'Zwei Dreier',     t:'fix', pts:45 },
  { id:'fullHouse',        label:'Full-House',      t:'fix', pts:25 },
  { id:'grossesFullHouse', label:'Gr. Full-House',  t:'fix', pts:45 },
  { id:'kleineStrasse',    label:'Kl. Straße',      t:'fix', pts:30 },
  { id:'grosseStrasse',    label:'Gr. Straße',      t:'fix', pts:40 },
  { id:'highway',          label:'Highway',         t:'fix', pts:50 },
  { id:'kniffel',          label:'Kniffel',         t:'fix', pts:50 },
  { id:'kniffelExtreme',   label:'Kniffel Xtreme',  t:'fix', pts:75 },
  { id:'zehnMinus',        label:'10 oder weniger', t:'fix', pts:40 },
  { id:'dreiDreissig',     label:'33 oder mehr',    t:'fix', pts:40 },
  { id:'chance',           label:'Chance',          t:'var', desc:'alle Augen' },
  { id:'superChance',      label:'Super Chance',    t:'super',desc:'Augen × 2' },
];
const ALL_IDS = [...UPPER.map(c=>c.id), ...LOWER.map(c=>c.id)];

const C = {
  bg:'#0d0b1a', surface:'#16122b', surface2:'#1e1a35', border:'#2a2448',
  text:'#f0eeff', muted:'#7268a0', muted2:'#4a4270',
  green:'#22c55e', red:'#ef4444',
};
const PC  = ['#a855f7','#ec4899','#3b82f6','#f59e0b','#22c55e'];
const PCL = ['#d8b4fe','#f9a8d4','#93c5fd','#fde68a','#86efac'];

const MODE_ICON  = { manual:'📝', app:'🎲' };
const MODE_LABEL = { manual:'Manuell', app:'App-Modus' };
const VERSION = 'v7'; // ⬆️ Sync mit sw.js CACHE-Version halten

// ══ SCORING ENGINE ═══════════════════════════════════════════════

const dSum  = d => d.reduce((a,b)=>a+b,0);
const dCnts = d => { const c={}; d.forEach(v=>c[v]=(c[v]||0)+1); return c; };
const cVals = c => Object.values(c);
const cEnts = c => Object.entries(c);

const SCORE = {
  einer:   d => d.filter(x=>x===1).reduce((a,b)=>a+b,0),
  zweier:  d => d.filter(x=>x===2).reduce((a,b)=>a+b,0),
  dreier:  d => d.filter(x=>x===3).reduce((a,b)=>a+b,0),
  vierer:  d => d.filter(x=>x===4).reduce((a,b)=>a+b,0),
  fuenfer: d => d.filter(x=>x===5).reduce((a,b)=>a+b,0),
  sechser: d => d.filter(x=>x===6).reduce((a,b)=>a+b,0),
  dreierpasch:  d => { const c=dCnts(d); return cVals(c).some(v=>v>=3)?dSum(d):null; },
  viererpasch:  d => { const c=dCnts(d); return cVals(c).some(v=>v>=4)?dSum(d):null; },
  zweiPaare:    d => { const p=cEnts(dCnts(d)).filter(([,v])=>v>=2); return p.length>=2?dSum(d):null; },
  dreiPaare:    d => { const p=cEnts(dCnts(d)).filter(([,v])=>v>=2); return p.length>=3?35:null; },
  zweiDreier:   d => { const t=cEnts(dCnts(d)).filter(([,v])=>v>=3); return t.length>=2?45:null; },
  fullHouse: d => {
    const e=cEnts(dCnts(d)), t=e.find(([,v])=>v>=3);
    if (!t) return null;
    return e.find(([k,v])=>k!==t[0]&&v>=2)?25:null;
  },
  grossesFullHouse: d => {
    const e=cEnts(dCnts(d)), f=e.find(([,v])=>v>=4);
    if (!f) return null;
    return e.find(([k,v])=>k!==f[0]&&v>=2)?45:null;
  },
  kleineStrasse: d => {
    const u=[...new Set(d)].sort((a,b)=>a-b);
    for (let i=0;i<=u.length-4;i++)
      if (u[i+1]-u[i]===1&&u[i+2]-u[i+1]===1&&u[i+3]-u[i+2]===1) return 30;
    return null;
  },
  grosseStrasse: d => {
    const u=[...new Set(d)].sort((a,b)=>a-b);
    for (let i=0;i<=u.length-5;i++){
      let ok=true; for(let j=0;j<4;j++) if(u[i+j+1]-u[i+j]!==1){ok=false;break;} if(ok) return 40;
    } return null;
  },
  highway: d => {
    const u=[...new Set(d)].sort((a,b)=>a-b);
    if (u.length<6) return null;
    for (let i=0;i<=u.length-6;i++){
      let ok=true; for(let j=0;j<5;j++) if(u[i+j+1]-u[i+j]!==1){ok=false;break;} if(ok) return 50;
    } return null;
  },
  kniffel:        d => cVals(dCnts(d)).some(v=>v>=5)?50:null,
  kniffelExtreme: d => cVals(dCnts(d)).some(v=>v>=6)?75:null,
  zehnMinus:      d => dSum(d)<=10?40:null,
  dreiDreissig:   d => dSum(d)>=33?40:null,
  chance:         d => dSum(d),
  superChance:    d => dSum(d)*2,
};

// ══ HELPERS ══════════════════════════════════════════════════════

const calc    = s => { const u=UPPER.reduce((x,c)=>x+(s[c.id]??0),0),b=u>=73?45:0,l=LOWER.reduce((x,c)=>x+(s[c.id]??0),0); return {u,b,uTotal:u+b,l,total:u+b+l}; };
const isDone  = g => g.players.every(p=>ALL_IDS.every(id=>p.scores[id]!==undefined));
const ls      = (k,d)=>{ try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;} };
const lsSet   = (k,v)=>{ try{localStorage.setItem(k,JSON.stringify(v));}catch{} };
const lsDel   = k   =>{ try{localStorage.removeItem(k);}catch{} };
const pColor  = (name,roster,light=false)=>{ const i=roster.indexOf(name); return (light?PCL:PC)[i%5]; };
const colW    = n => n<=2?80:n<=3?72:n<=4?65:n<=5?60:n<=6?55:n<=7?52:48;
const avg     = arr => arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0;
const EMPTY_TURN = ()=>({dice:[0,0,0,0,0,0],held:[false,false,false,false,false,false],rollCount:0,chipUsed:false});
const gameMode = g => g.mode || 'manual'; // backward-compat

// ══ GITHUB ═══════════════════════════════════════════════════════

const ghH = t=>({Authorization:`token ${t}`,Accept:'application/vnd.github.v3+json'});
async function ghRead(cfg) {
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/gamedata.json`,{headers:ghH(cfg.token),cache:'no-store'});
  if (r.status===404) return {data:null,sha:null};
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  const j=await r.json();
  return {data:JSON.parse(atob(j.content.replace(/\n/g,''))),sha:j.sha};
}
async function ghWrite(cfg,data,sha) {
  const body={message:'Kniffel update',content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))))};
  if (sha) body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/gamedata.json`,{method:'PUT',headers:{...ghH(cfg.token),'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  return (await r.json()).content.sha;
}
function mergeData(local,remote) {
  // Games: union merge (both sides contribute)
  const games=[...(remote.games||[])], ids=new Set(games.map(g=>g.id));
  for (const g of (local.games||[])) if (!ids.has(g.id)){games.push(g);ids.add(g.id);}

  // Roster: local authoritative + new players from remote games (for stats).
  // Blocklist (kx:deleted_roster) permanently excludes deleted players — even if
  // they appear in old game history — so they never come back after sync.
  const localSet = new Set(local.roster||[]);
  const blocked  = new Set(ls('kx:deleted_roster',[]));
  const remoteGameNames = new Set((remote.games||[]).flatMap(g=>(g.players||[]).map(p=>p.name)));
  const roster = [...localSet];
  for (const name of remoteGameNames)
    if (!localSet.has(name) && !blocked.has(name)) roster.push(name);

  return {games:games.sort((a,b)=>a.id.localeCompare(b.id)),roster};
}

// ══ APP ══════════════════════════════════════════════════════════

// Migrate games without mode field → mark as 'manual'
function migrateGames(games) {
  const needsMigration = games.some(g => !g.mode);
  if (!needsMigration) return games;
  return games.map(g => g.mode ? g : {...g, mode:'manual'});
}

function App() {
  const [screen, setScreen] = useState('home');
  const [games,  setGames]  = useState(()=>{ const g=migrateGames(ls('kx:games',[])); lsSet('kx:games',g); return g; });
  const [cur,    setCur]    = useState(()=>ls('kx:current',null));
  const [roster, setRoster] = useState(()=>ls('kx:roster',[]));
  const [stab,   setStab]   = useState('leaderboard');
  const [statFilter, setStatFilter] = useState('all'); // 'all'|'manual'|'app'
  const [sPlayer,setSPlayer]= useState(null);
  const [sCmp,   setSCmp]   = useState([null,null]);
  const [ghCfg,  setGhCfg]  = useState(()=>ls('kx:gh',null));
  const [syncSt, setSyncSt] = useState('idle');
  const [syncMsg,setSyncMsg]= useState('');

  useEffect(()=>{ if(roster.length===0) setScreen('gameSetup'); else if(ghCfg?.token) doSync(); },[]);

  const doSync = async cfg => {
    const c=cfg||ghCfg; if(!c?.token) return;
    setSyncSt('syncing');
    try {
      const {data,sha}=await ghRead(c);
      if(data){
        const m=mergeData({games:ls('kx:games',[]),roster:ls('kx:roster',[])},data);
        const migrated=migrateGames(m.games);
        const hadUnmarked=migrated.some(g=>!m.games.find(og=>og.id===g.id)?.mode);
        setGames(migrated); lsSet('kx:games',migrated);
        setRoster(m.roster); lsSet('kx:roster',m.roster);
        lsSet('kx:gh_sha',sha);
        // Push back so remote JSON gets mode:'manual' on old games
        if(hadUnmarked) pushGh(migrated,m.roster);
      }
      setSyncSt('ok'); setSyncMsg(new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    } catch(e){setSyncSt('error');setSyncMsg(e.message);}
  };
  const pushGh = async (g,r) => {
    const c=ghCfg; if(!c?.token) return;
    setSyncSt('syncing');
    try {
      const {sha}=await ghRead(c);
      const newSha=await ghWrite(c,{version:1,roster:r,games:g},sha);
      lsSet('kx:gh_sha',newSha);
      setSyncSt('ok'); setSyncMsg(new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    } catch(e){setSyncSt('error');setSyncMsg(e.message);}
  };

  const saveGames    = (g,r) => { setGames(g); lsSet('kx:games',g); pushGh(g,r||roster); };
  const saveRoster   = r     => { setRoster(r); lsSet('kx:roster',r); };
  const saveCur      = g     => { setCur(g); g?lsSet('kx:current',g):lsDel('kx:current'); };
  const deletePlayer = name  => {
    const r = roster.filter(n=>n!==name);
    saveRoster(r);
    const blocked = [...new Set([...ls('kx:deleted_roster',[]), name])];
    lsSet('kx:deleted_roster', blocked);
    pushGh(games, r);
  };

  // Archive: remove player's scores from games but keep games for others.
  // Player data saved locally so they can be restored.
  const archivePlayer = name => {
    const gameEntries = games
      .filter(g => g.players.some(p => p.name === name))
      .map(g => ({ gameId: g.id, entry: g.players.find(p => p.name === name) }));
    const archive = ls('kx:archive', []);
    lsSet('kx:archive', [...archive.filter(a => a.name !== name),
      { name, archivedAt: new Date().toLocaleDateString('de-DE'), gameEntries }]);
    const newGames  = games.map(g => ({...g, players: g.players.filter(p => p.name !== name)}))
                           .filter(g => g.players.length > 0);
    const newRoster = roster.filter(n => n !== name);
    const blocked   = [...new Set([...ls('kx:deleted_roster',[]), name])];
    lsSet('kx:deleted_roster', blocked);
    saveRoster(newRoster);
    saveGames(newGames, newRoster);
  };

  // Hard delete: no games → just remove completely (no archive needed)
  const hardDeletePlayer = name => {
    const newRoster = roster.filter(n => n !== name);
    const blocked   = [...new Set([...ls('kx:deleted_roster',[]), name])];
    lsSet('kx:deleted_roster', blocked);
    saveRoster(newRoster);
    saveGames(games, newRoster);
  };

  const restorePlayer = name => {
    const archive  = ls('kx:archive', []);
    const archived = archive.find(a => a.name === name);
    if (!archived) return;
    const newGames = games.map(g => {
      const found = archived.gameEntries.find(e => e.gameId === g.id);
      if (!found || g.players.some(p => p.name === name)) return g;
      return {...g, players: [...g.players, found.entry]};
    });
    lsSet('kx:archive', archive.filter(a => a.name !== name));
    const blocked = ls('kx:deleted_roster', []).filter(n => n !== name);
    lsSet('kx:deleted_roster', blocked);
    const newRoster = [...roster, name];
    saveRoster(newRoster);
    saveGames(newGames, newRoster);
  };

  const startGame = (sel, mode) => {
    const nr=[...new Set([...roster,...sel])]; saveRoster(nr);
    const base = { id:Date.now().toString(), date:new Date().toLocaleDateString('de-DE'), mode,
      players: sel.map(name=>({name,scores:{},chips:3})) };
    saveCur(mode==='app'
      ? {...base, currentPlayerIdx:0, turn:EMPTY_TURN()}
      : base);
    setScreen('game');
  };
  const finishGame = () => { saveGames([...games,cur],roster); saveCur(null); setScreen('home'); };

  const syncBadge = html`<span style=${{fontSize:11,color:syncSt==='ok'?C.green:syncSt==='error'?C.red:C.muted}}>
    ${syncSt==='syncing'?'↻ Sync…':syncSt==='ok'?`☁ ${syncMsg}`:syncSt==='error'?'⚠ Sync-Fehler':''}
  </span>`;

  return html`<div style=${{minHeight:'100vh',background:C.bg,color:C.text}}>
    ${screen==='home'     && html`<${Home}       ...${{games,roster,cur,syncBadge,onNew:()=>setScreen('gameSetup'),onContinue:()=>setScreen('game'),onStats:()=>setScreen('stats'),onGh:()=>setScreen('gh')}}/>`}
    ${screen==='gameSetup'&& html`<${GameSetup}  games=${games} roster=${roster} onStart=${startGame} onDeletePlayer=${deletePlayer} onBack=${()=>setScreen('home')}/>`}
    ${screen==='game'&&cur&& (gameMode(cur)==='app'
      ? html`<${DiceGame}   ...${{game:cur,roster,onUpdate:saveCur,onFinish:finishGame,onBack:()=>setScreen('home')}}/>`
      : html`<${ManualGame} ...${{game:cur,roster,onUpdate:saveCur,onFinish:finishGame,onBack:()=>setScreen('home')}}/>`)}
    ${screen==='stats'    && html`<${Stats}       ...${{games,roster,tab:stab,setTab:setStab,filter:statFilter,setFilter:setStatFilter,selPlayer:sPlayer,setSelPlayer:setSPlayer,cmp:sCmp,setCmp:setSCmp,onArchive:archivePlayer,onHardDelete:hardDeletePlayer,onRestore:restorePlayer,onBack:()=>setScreen('home')}}/>`}
    ${screen==='gh'       && html`<${GhSettings}  initial=${ghCfg} onSave=${cfg=>{setGhCfg(cfg);lsSet('kx:gh',cfg);if(cfg)doSync(cfg);setScreen('home');}} onBack=${()=>setScreen('home')}/>`}
  </div>`;
}

// ══ HOME ═════════════════════════════════════════════════════════

function Home({games,roster,cur,syncBadge,onNew,onContinue,onStats,onGh}) {
  const recent=[...games].reverse().slice(0,4);
  return html`<div style=${{maxWidth:460,margin:'0 auto',padding:'0 16px 48px'}}>
    <div style=${{textAlign:'center',padding:'44px 0 26px'}}>
      <div style=${{fontSize:40,fontWeight:900,letterSpacing:-1}}>Kniffel<span style=${{color:PC[0],fontStyle:'italic'}}>Extreme</span></div>
      <div style=${{marginTop:5,fontSize:11,color:C.muted2}}>${VERSION}</div>
    </div>
    <div style=${{display:'flex',flexDirection:'column',gap:10}}>
      ${cur && html`<${Btn} onClick=${onContinue} bg=${PC[0]}>
        ${MODE_ICON[gameMode(cur)]} Spiel fortsetzen
      </${Btn}>`}
      <${Btn} onClick=${onNew} bg=${C.surface2} border=${C.border}>+ Neues Spiel</${Btn}>
      <${Btn} onClick=${onStats} bg=${C.surface2} border=${C.border}>
        📊 Statistiken <span style=${{fontSize:12,color:C.muted,marginLeft:4}}>${games.length} Spiele</span>
      </${Btn}>
    </div>
    <div style=${{display:'flex',justifyContent:'center',marginTop:8}}>
      ${syncBadge}
    </div>
    <div style=${{display:'flex',justifyContent:'center',marginTop:4}}>
      <button onClick=${onGh} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:13}}>☁ GitHub Sync</button>
    </div>
    ${recent.length>0 && html`<div style=${{marginTop:28}}>
      <div style=${{fontSize:11,color:C.muted2,letterSpacing:2,textTransform:'uppercase',marginBottom:10,fontWeight:700}}>Letzte Spiele</div>
      ${recent.map(g=>{
        const sc=g.players.map(p=>calc(p.scores).total), mx=Math.max(...sc);
        const m=gameMode(g);
        return html`<div key=${g.id} style=${{padding:'10px 0',borderBottom:`1px solid ${C.border}`}}>
          <div style=${{display:'flex',justifyContent:'space-between',marginBottom:4,alignItems:'center'}}>
            <span style=${{color:C.muted,fontSize:12}}>${g.date}</span>
            <span style=${{fontSize:11,background:C.surface2,borderRadius:6,padding:'2px 6px',color:C.muted}}>${MODE_ICON[m]} ${MODE_LABEL[m]}</span>
          </div>
          <div style=${{display:'flex',flexWrap:'wrap',gap:8}}>
            ${g.players.map((p,i)=>html`<span key=${i} style=${{fontSize:13,color:sc[i]===mx?PCL[i%5]:C.muted}}>
              ${p.name}: <strong>${sc[i]}</strong>
            </span>`)}
          </div>
        </div>`;
      })}
    </div>`}
  </div>`;
}

// ══ GAME SETUP ═══════════════════════════════════════════════════

function GameSetup({games,roster,onStart,onDeletePlayer,onBack}) {
  const [selected,setSelected] = useState([]);
  const [newName, setNewName]  = useState('');
  const [editing, setEditing]  = useState(false);

  // 5 most recently active players still in roster
  const recentActive = [...new Set(
    [...games].reverse().flatMap(g=>g.players.map(p=>p.name))
  )].filter(n=>roster.includes(n)).slice(0,5);

  // Remaining roster members not in the top-5
  const remaining = roster.filter(n=>!recentActive.includes(n));

  const toggle = name => {
    if (editing) return;
    selected.includes(name)
      ? setSelected(selected.filter(n=>n!==name))
      : selected.length<10 && setSelected([...selected,name]);
  };
  const addNew = () => {
    const n=newName.trim(); if(!n||selected.length>=10) return;
    if(!selected.includes(n)) setSelected([...selected,n]);
    setNewName('');
  };
  const addFromDropdown = name => {
    if(!name||selected.includes(name)||selected.length>=10) return;
    setSelected([...selected,name]);
  };
  const deletePlayer = name => {
    setSelected(sel=>sel.filter(n=>n!==name));
    onDeletePlayer(name);
  };

  const ready = selected.length >= 2;

  return html`<div style=${{maxWidth:460,margin:'0 auto',padding:'20px 16px 40px'}}>
    <div style=${{display:'flex',alignItems:'center',gap:12,marginBottom:24}}>
      ${roster.length>0&&html`<button onClick=${onBack} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:20,padding:0}}>‹</button>`}
      <span style=${{fontSize:22,fontWeight:800,flex:1}}>Neues Spiel</span>
    </div>

    ${selected.length>0&&html`<div style=${{marginBottom:20}}>
      <div style=${{fontSize:11,color:C.muted2,letterSpacing:2,textTransform:'uppercase',marginBottom:8,fontWeight:700}}>Ausgewählt (${selected.length}/10)</div>
      <div style=${{display:'flex',flexWrap:'wrap',gap:8}}>
        ${selected.map((n,i)=>html`<div key=${n} style=${{display:'flex',alignItems:'center',gap:6,
          background:C.surface2,border:`2px solid ${PC[i%5]}`,borderRadius:20,padding:'6px 12px'}}>
          <span style=${{color:PC[i%5],fontWeight:700,fontSize:12}}>${i+1}</span>
          <span style=${{fontSize:13}}>${n}</span>
          <button onClick=${()=>toggle(n)} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:14,padding:'0 0 0 4px',lineHeight:1}}>×</button>
        </div>`)}
      </div>
    </div>`}

    ${roster.length>0&&html`<div style=${{marginBottom:20}}>
      <div style=${{display:'flex',alignItems:'center',marginBottom:8}}>
        <div style=${{fontSize:11,color:C.muted2,letterSpacing:2,textTransform:'uppercase',fontWeight:700,flex:1}}>Bekannte Spieler</div>
        <button onClick=${()=>setEditing(e=>!e)} style=${{
          background:editing?'rgba(239,68,68,0.15)':C.surface2,
          border:`1px solid ${editing?C.red:C.border}`,
          borderRadius:10,padding:'3px 10px',
          color:editing?C.red:C.muted,cursor:'pointer',fontSize:11,fontWeight:700,
        }}>${editing?'✓ Fertig':'✎ Verwalten'}</button>
      </div>
      ${editing&&html`<div style=${{fontSize:11,color:C.red,marginBottom:8,padding:'6px 10px',
        background:'rgba(239,68,68,0.08)',borderRadius:8,border:`1px solid rgba(239,68,68,0.2)`}}>
        ⚠ × löscht die Spielerin dauerhaft aus der Auswahl (Statistiken bleiben erhalten)
      </div>`}

      <!-- Top 5 recent as quick-select buttons -->
      <div style=${{display:'flex',flexWrap:'wrap',gap:8}}>
        ${recentActive.map(n=>{
          const idx=selected.indexOf(n); const sel=idx>=0;
          return html`<div key=${n} style=${{
            display:'flex',alignItems:'center',gap:0,
            background:sel&&!editing?C.surface2:C.surface,
            border:`2px solid ${sel&&!editing?PC[idx%5]:editing?'rgba(239,68,68,0.4)':C.border}`,
            borderRadius:20,overflow:'hidden',
          }}>
            <button onClick=${()=>toggle(n)} disabled=${editing} style=${{
              background:'none',border:'none',
              padding:editing?'7px 8px 7px 14px':'7px 14px',
              color:sel&&!editing?PC[idx%5]:C.muted,
              cursor:editing?'default':'pointer',fontSize:13,fontWeight:sel&&!editing?700:400,
            }}>${sel&&!editing?`${idx+1}. `:''}${n}</button>
            ${editing&&html`<button onClick=${()=>deletePlayer(n)} style=${{
              background:'none',border:'none',borderLeft:`1px solid rgba(239,68,68,0.3)`,
              padding:'7px 10px',color:C.red,cursor:'pointer',fontSize:14,lineHeight:1,
            }}>×</button>`}
          </div>`;
        })}
      </div>

      <!-- Dropdown for remaining players -->
      ${remaining.length>0&&html`<div style=${{marginTop:10,position:'relative'}}>
        <select
          value=""
          onChange=${e=>{ addFromDropdown(e.target.value); e.target.value=''; }}
          style=${{
            width:'100%',background:C.surface,border:`1px solid ${C.border}`,
            borderRadius:12,padding:'10px 36px 10px 14px',
            color:C.muted,fontSize:13,outline:'none',cursor:'pointer',
          }}>
          <option value="">+ Weitere Spielerinnen…</option>
          ${remaining.map(n=>html`<option key=${n} value=${n}
            disabled=${selected.includes(n)||editing}
          >${n}${selected.includes(n)?' ✓':''}</option>`)}
        </select>
        <span style=${{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',color:C.muted,pointerEvents:'none'}}>▾</span>
        ${editing&&html`<div style=${{marginTop:6,display:'flex',flexWrap:'wrap',gap:6}}>
          ${remaining.map(n=>html`<div key=${n} style=${{
            display:'flex',alignItems:'center',gap:0,
            background:C.surface,border:`1px solid rgba(239,68,68,0.4)`,
            borderRadius:20,overflow:'hidden',fontSize:13,
          }}>
            <span style=${{padding:'5px 10px 5px 12px',color:C.muted}}>${n}</span>
            <button onClick=${()=>deletePlayer(n)} style=${{
              background:'none',border:'none',borderLeft:`1px solid rgba(239,68,68,0.3)`,
              padding:'5px 10px',color:C.red,cursor:'pointer',fontSize:14,lineHeight:1,
            }}>×</button>
          </div>`)}
        </div>`}
      </div>`}
    </div>`}

    <div style=${{marginBottom:28}}>
      <div style=${{fontSize:11,color:C.muted2,letterSpacing:2,textTransform:'uppercase',marginBottom:8,fontWeight:700}}>Neuen Spieler</div>
      <div style=${{display:'flex',gap:8}}>
        <input value=${newName} onChange=${e=>setNewName(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&addNew()}
          placeholder="Name eingeben…" style=${{flex:1,background:C.surface2,border:`1px solid ${C.border}`,
          borderRadius:12,padding:'11px 14px',color:C.text,fontSize:15,outline:'none'}}/>
        <button onClick=${addNew} disabled=${!newName.trim()||selected.length>=10}
          style=${{background:PC[0],border:'none',borderRadius:12,padding:'11px 18px',color:'white',
          cursor:'pointer',fontWeight:700,fontSize:15,opacity:(!newName.trim()||selected.length>=10)?0.4:1}}>+</button>
      </div>
    </div>

    <!-- MODE SELECTION -->
    ${ready && html`<div>
      <div style=${{fontSize:11,color:C.muted2,letterSpacing:2,textTransform:'uppercase',marginBottom:12,fontWeight:700,textAlign:'center'}}>
        Wie möchtet ihr spielen?
      </div>
      <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <button onClick=${()=>onStart(selected,'manual')} style=${{
          background:C.surface2,border:`2px solid ${C.border}`,borderRadius:16,
          padding:'18px 12px',cursor:'pointer',color:C.text,textAlign:'center',
          transition:'border-color 0.2s',
        }}
        onMouseEnter=${e=>{e.currentTarget.style.borderColor=PC[1];}}
        onMouseLeave=${e=>{e.currentTarget.style.borderColor=C.border;}}>
          <div style=${{fontSize:30,marginBottom:8}}>📝</div>
          <div style=${{fontSize:14,fontWeight:800,marginBottom:4}}>Manuell</div>
          <div style=${{fontSize:11,color:C.muted,lineHeight:1.4}}>Selbst würfeln & Punkte eintragen</div>
        </button>
        <button onClick=${()=>onStart(selected,'app')} className="glow-btn" style=${{
          border:'none',borderRadius:16,
          padding:'18px 12px',cursor:'pointer',color:'white',textAlign:'center',
          boxShadow:`0 4px 24px rgba(168,85,247,0.35)`,
        }}>
          <div style=${{fontSize:30,marginBottom:8}}>🎲</div>
          <div style=${{fontSize:14,fontWeight:800,marginBottom:4}}>App-Modus</div>
          <div style=${{fontSize:11,opacity:0.85,lineHeight:1.4}}>App würfelt & berechnet alles</div>
        </button>
      </div>
    </div>`}
    ${!ready && html`<div style=${{color:C.muted,textAlign:'center',fontSize:13,padding:'20px 0'}}>Mindestens 2 Spieler wählen</div>`}
  </div>`;
}

// ══ MANUAL GAME (Scoreboard) ══════════════════════════════════════

function ManualGame({game,roster,onUpdate,onFinish,onBack}) {
  const [modal,setModal] = useState(null);
  const [mVal, setMVal]  = useState('');

  const n   = game.players.length;
  const sc  = game.players.map(p=>calc(p.scores));
  const cw  = colW(n);
  const done= isDone(game);
  const filled=game.players.reduce((s,p)=>s+ALL_IDS.filter(id=>p.scores[id]!==undefined).length,0);
  const pct =Math.round(filled/(ALL_IDS.length*n)*100);

  const cBg =(pi,id)=>{const v=game.players[pi].scores[id];return v===undefined?C.surface2:v===0?'#2d0a0a':'#1a1040';};
  const cCol=(pi,id)=>{const v=game.players[pi].scores[id];return v===undefined?C.muted2:v===0?C.red:C.text;};
  const cTxt=(pi,id)=>{const v=game.players[pi].scores[id];return v===undefined?'·':v===0?'—':String(v);};
  const pCol =(pi)=>pColor(game.players[pi].name,roster);
  const pColL=(pi)=>pColor(game.players[pi].name,roster,true);

  const gridCols=`120px repeat(${n}, ${cw}px)`;
  const minW=120+n*cw+10;

  const openCell=(pIdx,cat)=>{ setModal({pIdx,cat}); const v=game.players[pIdx].scores[cat.id]; setMVal(v!==undefined?String(v):''); };
  const enterScore=val=>{ const {pIdx,cat}=modal; onUpdate({...game,players:game.players.map((p,i)=>i===pIdx?{...p,scores:{...p.scores,[cat.id]:val}}:p)}); setModal(null); };
  const clearCell=()=>{ const {pIdx,cat}=modal; const scores={...game.players[pIdx].scores}; delete scores[cat.id]; onUpdate({...game,players:game.players.map((p,i)=>i===pIdx?{...p,scores}:p)}); setModal(null); };

  return html`<div style=${{maxWidth:520,margin:'0 auto'}}>
    <div style=${{position:'sticky',top:0,zIndex:10,background:C.bg,borderBottom:`1px solid ${C.border}`,padding:'10px 12px'}}>
      <div style=${{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
        <button onClick=${onBack} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:20,padding:0}}>‹</button>
        <span style=${{fontSize:12,color:C.muted,flex:1}}>${game.date} <span style=${{background:C.surface2,borderRadius:4,padding:'1px 5px',marginLeft:4}}>📝 Manuell</span></span>
        <span style=${{fontSize:11,color:C.muted2}}>${pct}%</span>
      </div>
      <div style=${{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}}>
        ${game.players.map((p,i)=>html`<div key=${i} style=${{flexShrink:0,background:C.surface2,borderRadius:12,padding:'6px 12px',borderLeft:`3px solid ${pCol(i)}`,minWidth:90}}>
          <div style=${{fontSize:10,color:C.muted,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:80}}>${p.name}</div>
          <div style=${{fontSize:22,fontWeight:900,color:pColL(i)}}>${sc[i].total}</div>
          <div style=${{fontSize:9,color:C.muted}}>${sc[i].b?html`<span style=${{color:C.green}}>✓ Bonus</span>`:html`<span>−${73-sc[i].u}</span>`}</div>
        </div>`)}
      </div>
      <div style=${{height:3,background:C.surface2,borderRadius:2,marginTop:8}}>
        <div style=${{height:3,borderRadius:2,background:`linear-gradient(90deg,${PC[0]},${PC[1]})`,width:`${pct}%`,transition:'width 0.3s'}}/>
      </div>
    </div>

    <div style=${{overflowX:'auto',padding:'8px 0 32px'}}>
      <div style=${{minWidth:`${minW}px`,padding:'0 12px'}}>
        <${GSec} label="OBERER TEIL"/>
        <div style=${{display:'grid',gridTemplateColumns:gridCols,gap:4,marginBottom:4}}>
          <div/>
          ${game.players.map((p,i)=>html`<div key=${i} style=${{textAlign:'center',fontSize:10,fontWeight:700,color:pCol(i),overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${p.name}</div>`)}
        </div>
        ${UPPER.map(cat=>html`<${GRow} key=${cat.id} gridCols=${gridCols} label=${html`<span style=${{fontSize:14}}>${cat.face} ${cat.label}</span>`} sub=${`nur ${cat.label}`}>
          ${game.players.map((_,i)=>html`<${GCell} key=${i} bg=${cBg(i,cat.id)} color=${cCol(i,cat.id)} cw=${cw} onClick=${()=>openCell(i,cat)}>${cTxt(i,cat.id)}</${GCell}>`)}
        </${GRow}>`)}
        <${GTot} gridCols=${gridCols} label="Summe"              vals=${sc.map(s=>s.u)}/>
        <${GTot} gridCols=${gridCols} label="Bonus (ab 73→+45)"  vals=${sc.map(s=>s.b)} sub=${sc.map(s=>s.b?'✓':`-${73-s.u}`)} subC=${sc.map(s=>s.b?C.green:C.muted)}/>
        <${GTot} gridCols=${gridCols} label="Oberer Teil"        vals=${sc.map(s=>s.uTotal)} hi=${true}/>
        <${GSec} label="UNTERER TEIL"/>
        ${LOWER.map(cat=>html`<${GRow} key=${cat.id} gridCols=${gridCols} label=${cat.label} sub=${cat.t==='fix'?`${cat.pts} Pkt`:cat.desc}>
          ${game.players.map((_,i)=>html`<${GCell} key=${i} bg=${cBg(i,cat.id)} color=${cCol(i,cat.id)} cw=${cw} onClick=${()=>openCell(i,cat)}>${cTxt(i,cat.id)}</${GCell}>`)}
        </${GRow}>`)}
        <${GTot} gridCols=${gridCols} label="Unterer Teil"  vals=${sc.map(s=>s.l)}/>
        <${GTot} gridCols=${gridCols} label="Oberer Teil"   vals=${sc.map(s=>s.uTotal)}/>
        <${GTot} gridCols=${gridCols} label="ENDSUMME"      vals=${sc.map(s=>s.total)} hi=${true} big=${true} pColors=${game.players.map((_,i)=>pColL(i))}/>

        ${done && html`<div style=${{marginTop:20,background:'linear-gradient(135deg,#2d1060,#1a0a30)',borderRadius:20,padding:'20px',textAlign:'center',border:`1px solid ${PC[0]}`}}>
          <div style=${{fontSize:26}}>🎉</div>
          <div style=${{fontSize:20,fontWeight:900,marginTop:6}}>
            ${(()=>{const mx=Math.max(...sc.map(s=>s.total));const w=game.players.filter((_,i)=>sc[i].total===mx);return w.length===1?`${w[0].name} gewinnt!`:'Unentschieden!';})()}
          </div>
          <div style=${{display:'flex',flexWrap:'wrap',gap:8,justifyContent:'center',marginTop:8}}>
            ${game.players.map((p,i)=>html`<span key=${i} style=${{color:pColL(i),fontSize:13}}>${p.name}: <strong>${sc[i].total}</strong></span>`)}
          </div>
          <div style=${{marginTop:16}}><${Btn} onClick=${onFinish} bg=${PC[0]}>Spiel speichern & beenden</${Btn}></div>
        </div>`}
      </div>
    </div>

    ${modal && html`<${ManualModal} ...${{modal,roster,val:mVal,setVal:setMVal,onScore:enterScore,onCross:()=>enterScore(0),onClear:clearCell,onClose:()=>setModal(null)}}/>`}
  </div>`;
}

function GSec({label}) {
  return html`<div style=${{fontSize:10,fontWeight:700,color:C.muted,letterSpacing:2,textTransform:'uppercase',padding:'14px 0 6px',borderTop:`1px solid ${C.border}`,marginTop:6}}>${label}</div>`;
}
function GRow({gridCols,label,sub,children}) {
  return html`<div style=${{display:'grid',gridTemplateColumns:gridCols,gap:4,marginBottom:4,alignItems:'center'}}>
    <div><div style=${{fontSize:12,fontWeight:600}}>${label}</div>${sub&&html`<div style=${{fontSize:9,color:C.muted}}>${sub}</div>`}</div>
    ${children}
  </div>`;
}
function GCell({bg,color,onClick,cw,children}) {
  return html`<div onClick=${onClick} style=${{background:bg,borderRadius:9,height:38,width:`${cw}px`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:13,fontWeight:700,color,border:`1px solid ${C.border}`}}>${children}</div>`;
}
function GTot({gridCols,label,vals,sub,subC,hi,big,pColors}) {
  return html`<div style=${{display:'grid',gridTemplateColumns:gridCols,gap:4,marginBottom:3,alignItems:'center',background:hi?C.surface2:'transparent',borderRadius:9,padding:hi?'5px 6px':'3px 6px'}}>
    <div style=${{fontSize:hi?11:10,color:hi?C.text:C.muted,fontWeight:hi?700:400}}>${label}</div>
    ${vals.map((v,i)=>html`<div key=${i} style=${{textAlign:'center',fontSize:big?20:hi?13:12,fontWeight:hi||big?800:500,color:big?(pColors?.[i]||C.text):hi?C.text:C.muted}}>
      ${v}${sub&&html`<div style=${{fontSize:9,color:subC?.[i]??C.muted,fontWeight:400}}>${sub[i]}</div>`}
    </div>`)}
  </div>`;
}

function ManualModal({modal,roster,val,setVal,onScore,onCross,onClear,onClose}) {
  const {pIdx,cat}=modal;
  const pc=pColor(modal.cat&&window._curGame?.players[pIdx]?.name,roster)||PC[pIdx%5];
  return html`<div onClick=${onClose} style=${{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'flex-end',justifyContent:'center',zIndex:50}}>
    <div onClick=${e=>e.stopPropagation()} className="slide-up" style=${{background:C.surface,borderRadius:'22px 22px 0 0',width:'100%',maxWidth:460,padding:'20px 20px 40px',borderTop:`1px solid ${C.border}`}}>
      <div style=${{width:36,height:4,background:C.border,borderRadius:2,margin:'0 auto 18px'}}/>
      <div style=${{textAlign:'center',marginBottom:18}}>
        <div style=${{fontSize:18,fontWeight:800}}>${cat.label}</div>
        <div style=${{fontSize:12,color:C.muted,marginTop:3}}>${cat.t==='fix'?`${cat.pts} Punkte bei Erfolg`:cat.t==='super'?'alle Augen × 2 — Endpunktzahl eingeben':'alle Augen zählen'}</div>
      </div>
      ${cat.t==='fix'
        ?html`<div style=${{display:'flex',flexDirection:'column',gap:10}}>
            <${Btn} onClick=${()=>onScore(cat.pts)} bg="#14532d">✓ Erreicht — ${cat.pts} Punkte</${Btn}>
            <${Btn} onClick=${onCross} bg="#7f1d1d">✕ Streichen — 0 Punkte</${Btn}>
          </div>`
        :html`<div style=${{display:'flex',flexDirection:'column',gap:10}}>
            <input type="number" min="0" value=${val} onChange=${e=>setVal(e.target.value)} autoFocus
              style=${{background:C.surface2,border:`2px solid ${pc}`,borderRadius:14,padding:'14px',color:C.text,fontSize:24,textAlign:'center',outline:'none',width:'100%'}} placeholder="Punkte"/>
            <${Btn} onClick=${()=>val!==''&&onScore(Number(val))} bg=${pc} disabled=${val===''}>✓ Eintragen</${Btn}>
            <${Btn} onClick=${onCross} bg="#7f1d1d">✕ Streichen — 0 Punkte</${Btn}>
          </div>`}
      ${val!==''&&html`<button onClick=${onClear} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:12,marginTop:10,display:'block',width:'100%',textAlign:'center'}}>Eintrag löschen</button>`}
    </div>
  </div>`;
}

// ══ DICE GAME (App-Modus) ═════════════════════════════════════════

const PIP_POS = {
  1:[[27,27]], 2:[[16,16],[38,38]], 3:[[38,16],[27,27],[16,38]],
  4:[[16,16],[38,16],[16,38],[38,38]], 5:[[16,16],[38,16],[27,27],[16,38],[38,38]],
  6:[[16,13],[38,13],[16,27],[38,27],[16,41],[38,41]],
};

function Die({value,held,rolled,isDten,canHold,onToggle}) {
  const isFirst=useRef(true);
  const animCls=isFirst.current&&rolled&&!held?'die-roll':'';
  useEffect(()=>{isFirst.current=false;},[]);
  const bg=isDten?(held?'#5b1e1e':'#7f1d1d'):(held?'#2d1a5e':'#1e1a35');
  const brd=isDten?(held?'#fca5a5':'#ef4444'):(held?PC[0]:'#3a3060');
  const pips=(rolled&&!isDten)?(PIP_POS[value]||[]):[];
  return html`<div className=${animCls} onClick=${canHold?onToggle:undefined} style=${{
    width:52,height:52,flexShrink:0,background:bg,border:`2px solid ${brd}`,borderRadius:10,
    display:'flex',alignItems:'center',justifyContent:'center',cursor:canHold?'pointer':'default',
    position:'relative',userSelect:'none',opacity:rolled?1:0.2,
    boxShadow:held?(isDten?`0 0 0 3px #ef4444,inset 0 2px 8px rgba(0,0,0,0.5)`:`0 0 0 3px ${PC[0]},inset 0 2px 8px rgba(0,0,0,0.5)`):'0 3px 10px rgba(0,0,0,0.4)',
    transition:'border-color 0.15s,background 0.15s,box-shadow 0.15s,opacity 0.2s',
  }}>
    ${isDten?html`<span style=${{fontSize:20,fontWeight:900,color:held?'#fca5a5':'white',lineHeight:1}}>${rolled?value:'?'}</span>`
            :html`<svg viewBox="0 0 54 54" width="52" height="52" style=${{position:'absolute',top:0,left:0}}>
                ${pips.map(([cx,cy],i)=>html`<circle key=${i} cx=${cx} cy=${cy} r="4.5" fill="white"/>`)}
              </svg>`}
    ${isDten&&rolled&&html`<div style=${{position:'absolute',bottom:2,left:0,right:0,textAlign:'center',fontSize:7,color:'#ef4444',fontWeight:700,letterSpacing:0.5}}>D10</div>`}
    ${held&&html`<div style=${{position:'absolute',top:-6,right:-6,background:isDten?'#ef4444':PC[0],borderRadius:'50%',width:16,height:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,color:'white',zIndex:2,boxShadow:'0 1px 4px rgba(0,0,0,0.5)',fontWeight:900}}>✓</div>`}
  </div>`;
}

function CatRow({label,sub,scored,scoredVal,pot,good,onClick}) {
  return html`<div onClick=${onClick} style=${{
    display:'flex',alignItems:'center',gap:8,padding:'8px 12px',marginBottom:3,borderRadius:12,
    background:scored?'transparent':good?'rgba(168,85,247,0.08)':'transparent',
    border:`1px solid ${scored?C.border:good?'rgba(168,85,247,0.3)':C.border}`,
    cursor:scored?'default':'pointer',opacity:scored?0.4:1,minHeight:44,
  }}>
    <div style=${{flex:1,minWidth:0}}>
      <div style=${{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${label}</div>
      ${sub&&html`<div style=${{fontSize:9,color:C.muted}}>${sub}</div>`}
    </div>
    <div style=${{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
      <span style=${{fontSize:15,fontWeight:900,color:scored?C.muted:good?PCL[0]:C.muted2,minWidth:32,textAlign:'right'}}>
        ${scored?scoredVal:good?pot:'—'}
      </span>
      ${!scored&&html`<span style=${{width:20,height:20,borderRadius:'50%',background:good?PC[0]:'transparent',border:`1px solid ${good?PC[0]:C.border}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'white',flexShrink:0}}>${good?'▶':'✕'}</span>`}
    </div>
  </div>`;
}

function DiceGame({game,roster,onUpdate,onFinish,onBack}) {
  const [scoreModal,setScoreModal]=useState(null);
  const [rolling,setRolling]=useState(false);
  const [rollKey,setRollKey]=useState(0);
  const [lastScore,setLastScore]=useState(null);

  const player=game.players[game.currentPlayerIdx];
  const turn=game.turn;
  const maxRolls=turn.chipUsed?4:3;
  const canRoll=!rolling&&turn.rollCount<maxRolls;
  const hasRolled=turn.rollCount>0;
  const mustScore=turn.rollCount>=maxRolls;
  const done=isDone(game);

  const potentials={};
  if(hasRolled) [...UPPER,...LOWER].forEach(cat=>{
    if(player.scores[cat.id]===undefined) potentials[cat.id]=SCORE[cat.id](turn.dice);
  });

  const doRoll=useCallback(()=>{
    if(!canRoll||rolling) return;
    setRolling(true);
    const newDice=turn.dice.map((d,i)=>{
      if(turn.rollCount>0&&turn.held[i]) return d;
      return i===5?Math.floor(Math.random()*10):Math.floor(Math.random()*6)+1;
    });
    setTimeout(()=>{
      onUpdate({...game,turn:{...turn,dice:newDice,rollCount:turn.rollCount+1,
        held:turn.rollCount===0?[false,false,false,false,false,false]:turn.held}});
      setRollKey(k=>k+1); setRolling(false);
    },380);
  },[game,turn,canRoll,rolling]);

  const toggleHold=i=>{ if(!hasRolled||mustScore) return; const h=[...turn.held];h[i]=!h[i]; onUpdate({...game,turn:{...turn,held:h}}); };
  const useChip=()=>{ if(player.chips<=0||turn.chipUsed||turn.rollCount<3) return; const np=game.players.map((p,i)=>i===game.currentPlayerIdx?{...p,chips:p.chips-1}:p); onUpdate({...game,players:np,turn:{...turn,chipUsed:true}}); };

  const scoreCategory=(catId,pts)=>{
    const np=game.players.map((p,i)=>i===game.currentPlayerIdx?{...p,scores:{...p.scores,[catId]:pts}}:p);
    const nextIdx=(game.currentPlayerIdx+1)%game.players.length;
    onUpdate({...game,players:np,currentPlayerIdx:nextIdx,turn:EMPTY_TURN()});
    setLastScore({pts}); setTimeout(()=>setLastScore(null),2000); setScoreModal(null);
  };

  const pCol=pColor(player.name,roster); const pColL=pColor(player.name,roster,true);
  const sc=calc(player.scores);
  const Toast=lastScore&&html`<div className="pop-in" style=${{position:'fixed',top:80,left:'50%',transform:'translateX(-50%)',background:C.surface,border:`1px solid ${PC[0]}`,borderRadius:14,padding:'10px 20px',fontSize:14,fontWeight:700,zIndex:100,color:lastScore.pts>0?C.green:C.red,whiteSpace:'nowrap',boxShadow:'0 8px 32px rgba(0,0,0,0.5)'}}>${lastScore.pts>0?`+${lastScore.pts} Punkte! 🎉`:'Gestrichen ✕'}</div>`;

  return html`<div style=${{maxWidth:460,margin:'0 auto',paddingBottom:48}}>
    ${Toast}
    <!-- HEADER -->
    <div style=${{position:'sticky',top:0,zIndex:20,background:C.bg,borderBottom:`1px solid ${C.border}`,padding:'10px 14px 8px'}}>
      <div style=${{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
        <button onClick=${onBack} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:20,padding:0,lineHeight:1}}>‹</button>
        <div style=${{flex:1,minWidth:0}}>
          <div style=${{display:'flex',alignItems:'baseline',gap:6}}>
            <span style=${{fontWeight:800,fontSize:17,color:pColL,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160}}>${player.name}</span>
            <span style=${{fontSize:11,color:C.muted,flexShrink:0}}>ist dran</span>
            <span style=${{fontSize:10,background:C.surface2,borderRadius:4,padding:'1px 5px',color:C.muted}}>🎲 App</span>
          </div>
        </div>
        <div style=${{display:'flex',alignItems:'center',gap:3,marginRight:8}}>
          ${[0,1,2].map(i=>html`<span key=${i} style=${{fontSize:14,opacity:i<player.chips?1:0.2,transition:'opacity 0.3s'}}>🔴</span>`)}
        </div>
        <div style=${{textAlign:'right',flexShrink:0}}>
          <div style=${{fontSize:22,fontWeight:900,color:pColL,lineHeight:1}}>${sc.total}</div>
          <div style=${{fontSize:9,color:C.muted}}>${sc.b?html`<span style=${{color:C.green}}>✓ Bonus</span>`:html`<span>ob. ${sc.u}/73</span>`}</div>
        </div>
      </div>
      <div style=${{display:'flex',gap:6,overflowX:'auto',paddingBottom:2}}>
        ${game.players.map((p,i)=>i===game.currentPlayerIdx?null:html`<div key=${i} style=${{flexShrink:0,background:C.surface2,borderRadius:8,padding:'3px 8px',display:'flex',alignItems:'center',gap:5}}>
          <span style=${{width:6,height:6,borderRadius:'50%',background:pColor(p.name,roster),display:'inline-block',flexShrink:0}}/>
          <span style=${{fontSize:10,color:C.muted,maxWidth:60,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${p.name}</span>
          <span style=${{fontSize:11,fontWeight:700,color:pColor(p.name,roster,true)}}>${calc(p.scores).total}</span>
        </div>`)}
      </div>
    </div>

    <!-- DICE AREA -->
    <div style=${{background:C.surface,padding:'18px 14px 14px',marginBottom:2}}>
      <div style=${{display:'flex',justifyContent:'center',gap:6,marginBottom:12}}>
        ${[1,2,3,4].map(n=>{
          if(n===4&&!turn.chipUsed) return null;
          const dn=turn.rollCount>=n, cn=turn.rollCount===n-1;
          return html`<div key=${n} style=${{width:28,height:28,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,background:dn?pCol:'transparent',border:`2px solid ${dn?pCol:cn?C.muted:C.border}`,color:dn?'white':C.muted,transition:'all 0.25s'}}>${n}</div>`;
        })}
      </div>
      <div style=${{display:'flex',gap:5,justifyContent:'center',marginBottom:14}}>
        ${turn.dice.map((d,i)=>html`<${Die} key=${turn.held[i]?`${i}-held`:`${i}-${rollKey}`}
          value=${d} held=${turn.held[i]} rolled=${hasRolled} isDten=${i===5}
          canHold=${hasRolled&&!mustScore} onToggle=${()=>toggleHold(i)}/>`)}
      </div>
      ${!done&&html`<div style=${{display:'flex',gap:8}}>
        <button onClick=${doRoll} disabled=${!canRoll||rolling} className=${canRoll&&!rolling?'glow-btn':''}
          style=${{flex:1,padding:'14px',borderRadius:14,border:'none',background:canRoll?undefined:'#1a1635',color:'white',fontSize:15,fontWeight:800,cursor:canRoll?'pointer':'not-allowed',opacity:canRoll?1:0.45,boxShadow:canRoll?'0 4px 24px rgba(168,85,247,0.35)':'none',transition:'opacity 0.2s'}}>
          ${rolling?'…':turn.rollCount===0?'🎲 Würfeln':mustScore?'⬇ Kategorie wählen!':'🎲 Nochmal würfeln'}
        </button>
        ${turn.rollCount===3&&!turn.chipUsed&&player.chips>0&&html`<button onClick=${useChip} style=${{padding:'14px 12px',borderRadius:14,background:C.surface2,border:`1px solid ${C.border}`,color:C.text,cursor:'pointer',fontSize:13,fontWeight:700,whiteSpace:'nowrap'}}>🔴 4. Wurf</button>`}
      </div>`}
    </div>

    <!-- CATEGORIES -->
    ${hasRolled&&!done&&html`<div style=${{padding:'4px 10px 8px'}}>
      <div style=${{fontSize:10,fontWeight:700,color:C.muted2,letterSpacing:2,textTransform:'uppercase',padding:'10px 4px 6px'}}>OBERER TEIL</div>
      ${UPPER.map(cat=>{
        const scored=player.scores[cat.id]!==undefined, pot=potentials[cat.id], good=!scored&&pot!==undefined&&pot>0;
        return html`<${CatRow} key=${cat.id} label=${html`<span>${cat.face} ${cat.label}</span>`} scored=${scored} scoredVal=${player.scores[cat.id]} pot=${pot} good=${good} onClick=${()=>!scored&&setScoreModal({cat,pot,good})}/>`;
      })}
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 12px',background:C.surface,borderRadius:10,margin:'4px 0 8px',fontSize:11}}>
        <span style=${{color:C.muted}}>Oberer Teil: <strong style=${{color:C.text}}>${sc.u}</strong></span>
        ${sc.b?html`<span style=${{color:C.green,fontWeight:700}}>✓ Bonus +45!</span>`:html`<span style=${{color:C.muted}}>${73-sc.u} bis Bonus</span>`}
        <div style=${{width:60,height:4,background:C.surface2,borderRadius:2,overflow:'hidden'}}>
          <div style=${{height:4,borderRadius:2,background:PC[0],width:`${Math.min(100,sc.u/73*100)}%`}}/>
        </div>
      </div>
      <div style=${{fontSize:10,fontWeight:700,color:C.muted2,letterSpacing:2,textTransform:'uppercase',padding:'6px 4px 6px'}}>UNTERER TEIL</div>
      ${LOWER.map(cat=>{
        const scored=player.scores[cat.id]!==undefined, pot=potentials[cat.id], good=!scored&&pot!==null&&pot!==undefined;
        return html`<${CatRow} key=${cat.id} label=${cat.label} sub=${cat.t==='fix'?`${cat.pts} Pkt`:cat.t==='super'?'×2':undefined} scored=${scored} scoredVal=${player.scores[cat.id]} pot=${pot} good=${good} onClick=${()=>!scored&&setScoreModal({cat,pot,good})}/>`;
      })}
    </div>`}

    <!-- GAME OVER -->
    ${done&&html`<div style=${{padding:'16px 14px'}} className="pop-in">
      <div style=${{background:'linear-gradient(135deg,#2d1060,#1a0a30)',borderRadius:20,padding:'24px',textAlign:'center',border:`1px solid ${PC[0]}`,boxShadow:`0 0 40px rgba(168,85,247,0.2)`}}>
        <div style=${{fontSize:32}}>🎉</div>
        <div style=${{fontSize:22,fontWeight:900,marginTop:8}}>
          ${(()=>{const sc2=game.players.map(p=>calc(p.scores).total),mx=Math.max(...sc2),w=game.players.filter((_,i)=>sc2[i]===mx);return w.length===1?`${w[0].name} gewinnt!`:'Unentschieden!';})()}
        </div>
        <div style=${{display:'flex',flexWrap:'wrap',gap:10,justifyContent:'center',marginTop:12}}>
          ${game.players.map((p,i)=>{const s=calc(p.scores),ib=s.total===Math.max(...game.players.map(pp=>calc(pp.scores).total));return html`<div key=${i} style=${{background:C.surface2,borderRadius:12,padding:'8px 14px',border:`2px solid ${ib?PC[i%5]:C.border}`}}>
            <div style=${{fontSize:11,color:pColor(p.name,roster,true)}}>${p.name}</div>
            <div style=${{fontSize:24,fontWeight:900}}>${s.total}</div>
            ${s.b?html`<div style=${{fontSize:10,color:C.green}}>+45 Bonus</div>`:''}
          </div>`;})}
        </div>
        <div style=${{marginTop:20}}><${Btn} onClick=${onFinish} bg=${PC[0]}>✓ Spiel speichern & beenden</${Btn}></div>
      </div>
    </div>`}

    ${scoreModal&&html`<div onClick=${()=>setScoreModal(null)} style=${{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'flex-end',justifyContent:'center',zIndex:50}}>
      <div onClick=${e=>e.stopPropagation()} className="slide-up" style=${{background:C.surface,borderRadius:'22px 22px 0 0',width:'100%',maxWidth:460,padding:'20px 20px 44px',borderTop:`2px solid ${scoreModal.good?pCol:C.border}`}}>
        <div style=${{width:36,height:4,background:C.border,borderRadius:2,margin:'0 auto 18px'}}/>
        <div style=${{textAlign:'center',marginBottom:20}}>
          <div style=${{fontSize:20,fontWeight:800}}>${scoreModal.cat.label}</div>
          <div style=${{fontSize:12,color:C.muted,marginTop:4}}>${scoreModal.cat.t==='fix'?`Pauschal ${scoreModal.cat.pts} Punkte`:scoreModal.cat.t==='super'?`Alle Augen × 2 = ${scoreModal.pot}`:`Alle Augen = ${scoreModal.pot}`}</div>
          ${scoreModal.good&&html`<div style=${{fontSize:40,fontWeight:900,color:pColL,margin:'10px 0 4px',lineHeight:1}} className="pop-in">${scoreModal.pot}</div>`}
        </div>
        <div style=${{display:'flex',flexDirection:'column',gap:10}}>
          ${scoreModal.good&&html`<${Btn} onClick=${()=>scoreCategory(scoreModal.cat.id,scoreModal.pot)} bg="#14532d">✓ ${scoreModal.pot} Punkte eintragen</${Btn}>`}
          <${Btn} onClick=${()=>scoreCategory(scoreModal.cat.id,0)} bg="#7f1d1d">✕ Streichen — 0 Punkte</${Btn}>
          <button onClick=${()=>setScoreModal(null)} style=${{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:13,padding:'8px',textAlign:'center'}}>Abbrechen</button>
        </div>
      </div>
    </div>`}
  </div>`;
}
